name: Build DMG

on:
  workflow_dispatch:
  push:
    branches: [main, "cursor/**"]
    paths:
      - "WiFiLocator/**"
      - ".github/workflows/build-dmg.yml"
  pull_request:
    paths:
      - "WiFiLocator/**"
      - ".github/workflows/build-dmg.yml"

permissions:
  contents: read

jobs:
  dmg:
    name: Package WiFiLocator.dmg (macOS arm64)
    runs-on: macos-14
    defaults:
      run:
        working-directory: WiFiLocator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          uname -m

      - name: Build Release app + DMG
        env:
          MARKETING_VERSION: "1.0"
          SIGN_IDENTITY: "-"
        run: |
          chmod +x Scripts/package-dmg.sh Scripts/build.sh
          ./Scripts/package-dmg.sh

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: WiFiLocator-1.0-arm64-dmg
          path: |
            WiFiLocator/dist/WiFiLocator-1.0-arm64.dmg
            WiFiLocator/dist/WiFiLocator-1.0-arm64.dmg.sha256
          if-no-files-found: error
          retention-days: 30
